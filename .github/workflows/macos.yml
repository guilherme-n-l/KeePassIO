name: macOS

# Runs only when something the app build or its tests read changes;
# documentation, scripts and the other workflows are checked by the Linux
# workflow, which runs on every change. Keep this list in step with the
# folders the Xcode project and KeePassCore package use.
#
# Branches are checked through their pull request; pushing to a branch
# with an open pull request used to run every job twice, once for each
# event.
on:
  push:
    branches: [main]
    paths:
      - "keepassios/**"
      - "KeePassIOSAutoFill/**"
      - "keepassiosTests/**"
      - "keepassiosUITests/**"
      - "keepassios.xcodeproj/**"
      - "Config/**"
      - "Packages/**"
      - "Vendor/**"
      - ".swiftlint.yml"
      - ".swift-format"
      - "scripts/lint.sh"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "keepassios/**"
      - "KeePassIOSAutoFill/**"
      - "keepassiosTests/**"
      - "keepassiosUITests/**"
      - "keepassios.xcodeproj/**"
      - "Config/**"
      - "Packages/**"
      - "Vendor/**"
      - ".swiftlint.yml"
      - ".swift-format"
      - "scripts/lint.sh"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Build and test the app
    runs-on: macos-26
    # Well above a normal run; without it a hung simulator would hold the
    # runner for six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install linters
        run: brew install swiftlint shellcheck

      - name: Lint
        # Nix formatting is checked in the Linux job.
        run: scripts/lint.sh --skip-nix

      - name: Test core packages on macOS
        run: swift test --package-path Packages/KeePassCore

      - name: Boot the simulator
        run: |
          device="$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')"
          echo "DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b

      - name: Build and test the app on a simulator
        # On the booted simulator, one test at a time. With parallel
        # testing, xcodebuild first cloned the simulator twice and booted
        # the clones, which took 14 to 22 minutes on the hosted runner,
        # longer than running every test in turn.
        #
        # testLaunchPerformance only records launch times: with no
        # baseline it can't fail, and it took over a minute.
        run: |
          xcodebuild test \
            -project keepassios.xcodeproj \
            -scheme keepassios \
            -destination "id=$DEVICE" \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -skip-testing:keepassiosUITests/ScreenshotTests \
            -skip-testing:keepassiosUITests/KeePassIOUITests/testLaunchPerformance \
            CODE_SIGNING_ALLOWED=NO

      - name: Show test failures
        if: failure()
        run: |
          # The failure messages are only inside the result bundle; print
          # them so they can be read from the log.
          if [ -d TestResults.xcresult ]; then
            # Failure messages with their file and line, from the test tree.
            xcrun xcresulttool get test-results tests --path TestResults.xcresult \
              | python3 -c '
          import json, sys
          def walk(node, test=""):
              if node.get("nodeType") == "Test Case":
                  test = node.get("name", test)
              if node.get("nodeType") == "Failure Message":
                  print(test + ": " + node.get("name", ""))
              for child in node.get("children", []):
                  walk(child, test)
          for root in json.load(sys.stdin).get("testNodes", []):
              walk(root)
          '
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

  release:
    name: Build a Release archive
    # What goes to the App Store: Release configuration (whole-module
    # optimization), for devices, app and AutoFill extension. Unsigned
    # here; scripts/release.sh signs and uploads, on the owner's Mac or
    # from the TestFlight workflow.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Archive
        run: |
          xcodebuild archive \
            -project keepassios.xcodeproj \
            -scheme keepassios \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KeePassIO.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Check the archive
        run: |
          app=build/KeePassIO.xcarchive/Products/Applications/keepassios.app
          test -d "$app/PlugIns/KeePassIOSAutoFill.appex"
          test -f "$app/PrivacyInfo.xcprivacy"
          test -f "$app/PlugIns/KeePassIOSAutoFill.appex/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist"
