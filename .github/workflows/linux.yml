name: Linux

# Branches are checked through their pull request; pushing to a branch
# with an open pull request used to run every job twice, once for each
# event.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Lint, test and profile core packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is checked out as a merge commit; its first
          # parent is the base, for finding what the pull request changes.
          fetch-depth: 2

      - name: Find what changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # The vendored KDBXKit tests take most of this job's time, and
          # only KDBXKit itself or the toolchain can break them. Pull
          # requests that touch neither skip them; main and manual runs
          # always run them.
          kdbxkit=true
          if [ "$EVENT" = pull_request ] \
            && ! git diff --name-only HEAD^1 HEAD \
              | grep -qE '^(Vendor/KDBXKit/|scripts/setup-linux-toolchain\.sh$|\.github/workflows/linux\.yml$)'; then
            kdbxkit=false
          fi
          echo "kdbxkit=$kdbxkit" | tee -a "$GITHUB_OUTPUT"

      - name: Install Swift, swift-format, SwiftLint, ShellCheck and bpftrace
        run: sudo scripts/setup-linux-toolchain.sh

      - name: Install Nix (for nixfmt and the dev shell check)
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Check the Nix dev shell evaluates
        run: nix develop --command true

      - name: Install KeePassXC for interop tests
        run: sudo apt-get install -y -q keepassxc

      - name: Lint
        run: scripts/lint.sh

      - name: Build
        run: swift build --package-path Packages/KeePassCore -c release

      - name: Test
        run: swift test --package-path Packages/KeePassCore

      - name: Test vendored KDBXKit
        if: steps.changes.outputs.kdbxkit == 'true'
        run: swift test --package-path Vendor/KDBXKit
        env:
          KDBXKIT_REQUIRE_INTEROP: "1"

      - name: Check eBPF probes fire
        run: |
          mkdir -p profiles
          sudo Tools/bpf/run.sh spans.bt Packages/KeePassCore/.build/release/kpbench \
            probe-check --iterations 30 --trace profiles/probe-check.json | tee profiles/spans.txt
          grep -q '^@span_count\[kdf.argon2\]: 30$' profiles/spans.txt

      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-profiles
          path: profiles/
          if-no-files-found: ignore
